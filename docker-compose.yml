# ---------------------------------------------------------------------------
# Real Estate Market Intelligence Platform
# All credentials and tunables come from .env (see .env.example).
# docker compose automatically loads .env at the project root for the
# ${VAR} substitutions below; env_file additionally injects those values
# as real environment variables inside each container.
# ---------------------------------------------------------------------------

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY}"
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_SECRET_KEY}"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    MONGO_URI: mongodb://mongo:27017
    MONGO_DB: ${MONGO_DB}
    MONGO_COLLECTION: ${MONGO_COLLECTION}
    POSTGRES_HOST: postgres-dwh
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    MODEL_PATH: /opt/airflow/models/price_model.joblib
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./sql:/opt/airflow/sql
    - ./data:/opt/airflow/data
    - ./models:/opt/airflow/models
    - airflow_logs:/opt/airflow/logs
  depends_on:
    - airflow-db
    - mongo
    - postgres-dwh

services:
  # ---------------------------------------------------------------------
  # Landing zone: raw DVF documents stored as-is.
  # ---------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: dvf_mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:1.0.2
    container_name: dvf_mongo_express
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}

  # ---------------------------------------------------------------------
  # Analytical warehouse: star schema.
  # ---------------------------------------------------------------------
  postgres-dwh:
    image: postgres:16
    container_name: dvf_postgres_dwh
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_dwh_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

  # ---------------------------------------------------------------------
  # Airflow metadata database (separate from the analytical warehouse).
  # ---------------------------------------------------------------------
  airflow-db:
    image: postgres:16
    container_name: dvf_airflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    container_name: dvf_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db upgrade &&
        airflow users create \
          --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} \
          --firstname ${AIRFLOW_ADMIN_FIRSTNAME} --lastname ${AIRFLOW_ADMIN_LASTNAME} \
          --role Admin --email ${AIRFLOW_ADMIN_EMAIL}

  airflow-webserver:
    <<: *airflow-common
    container_name: dvf_airflow_webserver
    command: webserver
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    container_name: dvf_airflow_scheduler
    command: scheduler
    depends_on:
      - airflow-init

  # ---------------------------------------------------------------------
  # Presentation layer.
  # ---------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: dvf_dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres-dwh
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MODEL_PATH: /app/models/price_model.joblib
    volumes:
      - ./src:/app/src
      - ./models:/app/models
    depends_on:
      - postgres-dwh

volumes:
  mongo_data:
  postgres_dwh_data:
  airflow_db_data:
  airflow_logs: